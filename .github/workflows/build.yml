name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支或 tag（留空使用当前）'
        required: false
        default: ''

permissions:
  contents: write

env:
  MEDIAMTX_VERSION: v1.19.3

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- Windows -----
          - os: windows-latest
            label: windows-amd64
            artifact: youtube-live-relay-windows-amd64
            archive: zip
            mt_os: windows
            mt_arch: amd64
          # ----- macOS Intel -----
          - os: macos-13
            label: macos-x86_64
            artifact: youtube-live-relay-macos-x86_64
            archive: tar.gz
            mt_os: darwin
            mt_arch: amd64
          # ----- macOS Apple Silicon -----
          - os: macos-14
            label: macos-arm64
            artifact: youtube-live-relay-macos-arm64
            archive: tar.gz
            mt_os: darwin
            mt_arch: arm64
          # ----- Linux -----
          - os: ubuntu-latest
            label: linux-x86_64
            artifact: youtube-live-relay-linux-x86_64
            archive: tar.gz
            mt_os: linux
            mt_arch: amd64

    defaults:
      run:
        env:
          PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============== FFmpeg ==============
      - name: Install ffmpeg (Windows / gyan.dev)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/ffmpeg-stage"
          mkdir -p "$RUNNER_TEMP/ffmpeg-stage"
          echo "Downloading ffmpeg from gyan.dev..."
          curl -L --fail -o "$RUNNER_TEMP/ffmpeg.zip" \
            https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          # 用 PowerShell 解压到临时目录（Git Bash 解压 zip 不可靠）
          powershell -NoProfile -Command "Expand-Archive -Path '$RUNNER_TEMP/ffmpeg.zip' -DestinationPath '$RUNNER_TEMP/ffmpeg-stage' -Force"
          # gyan.dev 解压后是 ffmpeg-X.Y-essentials_build/bin/ffmpeg.exe
          FFMPEG_BIN_DIR=$(find "$RUNNER_TEMP/ffmpeg-stage" -type d -name bin | head -1)
          if [ -z "$FFMPEG_BIN_DIR" ]; then
            echo "::error::ffmpeg bin/ dir not found"
            find "$RUNNER_TEMP/ffmpeg-stage" -maxdepth 3 -type d
            exit 1
          fi
          echo "FFMPEG_BIN_DIR=$FFMPEG_BIN_DIR" >> "$GITHUB_ENV"
          ls -la "$FFMPEG_BIN_DIR"

      - name: Install ffmpeg (macOS / brew)
        if: matrix.os == 'macos-13' || matrix.os == 'macos-14'
        shell: bash
        run: |
          set -e
          brew install ffmpeg
          FFMPEG_BIN_DIR="$(brew --prefix ffmpeg)/bin"
          echo "FFMPEG_BIN_DIR=$FFMPEG_BIN_DIR" >> "$GITHUB_ENV"
          ls -la "$FFMPEG_BIN_DIR" | head -20

      - name: Install ffmpeg (Linux / johnvansickle)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y xz-utils
          echo "Downloading static ffmpeg from johnvansickle..."
          curl -L --fail -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          rm -rf "$RUNNER_TEMP/ffmpeg-stage"
          mkdir -p "$RUNNER_TEMP/ffmpeg-stage"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg-stage"
          # johnvansickle 静态版没有 bin/ 子目录，二进制直接在解压目录里
          FFMPEG_BIN_DIR=$(find "$RUNNER_TEMP/ffmpeg-stage" -type f -name ffmpeg | head -1 | xargs dirname)
          if [ -z "$FFMPEG_BIN_DIR" ]; then
            echo "::error::ffmpeg binary not found"
            find "$RUNNER_TEMP/ffmpeg-stage" -maxdepth 3 -type f
            exit 1
          fi
          echo "FFMPEG_BIN_DIR=$FFMPEG_BIN_DIR" >> "$GITHUB_ENV"
          ls -la "$FFMPEG_BIN_DIR"

      # ============== mediamtx ==============
      - name: Download mediamtx
        shell: bash
        run: |
          set -e
          case "${{ matrix.os }}" in
            windows-latest) EXT=zip ;;
            *)              EXT=tar.gz ;;
          esac
          URL="https://github.com/bluenviron/mediamtx/releases/download/${MEDIAMTX_VERSION}/mediamtx_${MEDIAMTX_VERSION}_${{ matrix.mt_os }}_${{ matrix.mt_arch }}.${EXT}"
          echo "Downloading: $URL"
          OUT="$RUNNER_TEMP/mediamtx.${EXT}"
          curl -L --fail -o "$OUT" "$URL"
          rm -rf "$RUNNER_TEMP/mediamtx-stage"
          mkdir -p "$RUNNER_TEMP/mediamtx-stage"
          if [ "$EXT" = "zip" ]; then
            powershell -NoProfile -Command "Expand-Archive -Path '$OUT' -DestinationPath '$RUNNER_TEMP/mediamtx-stage' -Force"
            EXE="mediamtx.exe"
          else
            tar -xzf "$OUT" -C "$RUNNER_TEMP/mediamtx-stage"
            EXE="mediamtx"
            chmod +x "$RUNNER_TEMP/mediamtx-stage/$EXE"
          fi
          echo "MEDIAMTX_DIR=$RUNNER_TEMP/mediamtx-stage" >> "$GITHUB_ENV"
          echo "MEDIAMTX_EXE=$EXE" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/mediamtx-stage"

      # ============== PyInstaller ==============
      - name: Run PyInstaller
        shell: bash
        run: |
          python build.py --clean

      # ============== Bundle ==============
      - name: Stage release files (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -e
          DIST="dist/youtube-relay"
          cp config.yaml.example "$DIST/" 2>/dev/null || true
          mkdir -p "$DIST/ffmpeg/bin"
          cp -r "$FFMPEG_BIN_DIR"/* "$DIST/ffmpeg/bin/"
          cp "$MEDIAMTX_DIR/$MEDIAMTX_EXE" "$DIST/mediamtx/"
          echo "=== dist/youtube-relay ==="
          ls -la "$DIST"
          echo "=== mediamtx ==="
          ls -la "$DIST/mediamtx"
          echo "=== ffmpeg/bin ==="
          ls -la "$DIST/ffmpeg/bin"

      - name: Stage release files (macOS / Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -e
          DIST="dist/youtube-relay"
          cp config.yaml.example "$DIST/" 2>/dev/null || true
          mkdir -p "$DIST/ffmpeg/bin"
          cp -r "$FFMPEG_BIN_DIR"/* "$DIST/ffmpeg/bin/"
          cp "$MEDIAMTX_DIR/$MEDIAMTX_EXE" "$DIST/mediamtx/"
          chmod +x "$DIST/mediamtx/mediamtx"
          chmod +x "$DIST/youtube-relay"
          echo "=== dist/youtube-relay ==="
          ls -la "$DIST"
          echo "=== mediamtx ==="
          ls -la "$DIST/mediamtx"
          echo "=== ffmpeg/bin ==="
          ls -la "$DIST/ffmpeg/bin"

      # ============== Archive ==============
      - name: Create zip archive (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/youtube-relay' -DestinationPath '${{ matrix.artifact }}.zip' -Force"
          ls -la "${{ matrix.artifact }}.zip"

      - name: Create tar.gz archive (macOS / Linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist youtube-relay
          ls -la "${{ matrix.artifact }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
