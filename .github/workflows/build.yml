name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: amd64
            mediamtx_url: https://github.com/bluenviron/mediamtx/releases/download/v1.19.3/mediamtx_v1.19.3_windows_amd64.zip
            binary_ext: .exe
            archive_ext: .zip

          - os: ubuntu-latest
            platform: linux
            arch: amd64
            mediamtx_url: https://github.com/bluenviron/mediamtx/releases/download/v1.19.3/mediamtx_v1.19.3_linux_amd64.tar.gz
            binary_ext: ''
            archive_ext: .tar.gz

          - os: macos-latest
            platform: macos
            arch: amd64
            mediamtx_url: https://github.com/bluenviron/mediamtx/releases/download/v1.19.3/mediamtx_v1.19.3_darwin_amd64.tar.gz
            binary_ext: ''
            archive_ext: .tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ---- FFmpeg ----
      - name: Install ffmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Write-Host "Downloading ffmpeg..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Write-Host "Extracting ffmpeg..."
          7z x ffmpeg.zip -offmpeg_temp -y > $null
          mkdir -Force ffmpeg/bin | Out-Null
          $ffmpegExe = Get-ChildItem -Path ffmpeg_temp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName ffmpeg/bin/ffmpeg.exe
          Remove-Item ffmpeg.zip -Force
          Remove-Item ffmpeg_temp -Recurse -Force
          Write-Host "ffmpeg installed at ffmpeg/bin/ffmpeg.exe"

      - name: Install ffmpeg (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p ffmpeg
          cp "$(which ffmpeg)" ffmpeg/ffmpeg
          echo "ffmpeg installed at ffmpeg/ffmpeg"

      - name: Install ffmpeg (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install ffmpeg
          mkdir -p ffmpeg
          cp "$(which ffmpeg)" ffmpeg/ffmpeg
          echo "ffmpeg installed at ffmpeg/ffmpeg"

      # ---- MediaMTX ----
      - name: Download mediamtx (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Write-Host "Downloading mediamtx..."
          Invoke-WebRequest -Uri "${{ matrix.mediamtx_url }}" -OutFile mediamtx.zip
          Write-Host "Extracting mediamtx..."
          7z x mediamtx.zip -omediamtx_temp -y > $null
          Copy-Item "mediamtx_temp/mediamtx.exe" mediamtx/mediamtx.exe -Force
          Remove-Item mediamtx.zip -Force
          Remove-Item mediamtx_temp -Recurse -Force
          Write-Host "mediamtx installed at mediamtx/mediamtx.exe"

      - name: Download mediamtx (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          echo "Downloading mediamtx..."
          curl -L -sS "${{ matrix.mediamtx_url }}" -o mediamtx.tar.gz
          echo "Extracting mediamtx..."
          tar -xzf mediamtx.tar.gz -C mediamtx/
          rm mediamtx.tar.gz
          chmod +x mediamtx/mediamtx
          echo "mediamtx installed at mediamtx/mediamtx"

      # ---- 配置 ----
      - name: Generate config.yaml for CI (Windows)
        if: matrix.platform == 'windows'
        run: copy config.yaml.example config.yaml

      - name: Generate config.yaml for CI (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          cp config.yaml.example config.yaml
          python -c "import yaml;c=yaml.safe_load(open('config.yaml'));c['ffmpeg']['path']='./ffmpeg/ffmpeg';c['mediamtx']['path']='./mediamtx/mediamtx';yaml.dump(c,open('config.yaml','w'),allow_unicode=True,default_flow_style=False,sort_keys=False)"

      - name: Create empty cookies.txt (Windows)
        if: matrix.platform == 'windows'
        run: echo $null >> cookies.txt

      - name: Create empty cookies.txt (Linux/macOS)
        if: matrix.platform != 'windows'
        run: touch cookies.txt

      # ---- 打包 ----
      - name: Build with PyInstaller
        run: python build.py

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/youtube-relay/* -DestinationPath youtube-relay-${{ matrix.platform }}-${{ matrix.arch }}.zip

      - name: Package (Linux/macOS)
        if: matrix.platform != 'windows'
        run: |
          tar -czf youtube-relay-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz -C dist/youtube-relay .

      # ---- 上传 ----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-relay-${{ matrix.platform }}-${{ matrix.arch }}
          path: youtube-relay-${{ matrix.platform }}-${{ matrix.arch }}.*

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: youtube-relay-${{ matrix.platform }}-${{ matrix.arch }}.*
          generate_release_notes: true

  # ---- RTMP 播放器打包（仅 Windows，需要系统安装 VLC） ----
  build-player:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install vlc (for player build)
        run: pip install python-vlc

      - name: Build player with PyInstaller
        run: python build_player.py

      - name: Package player
        shell: pwsh
        run: |
          Compress-Archive -Path dist/rtmp-player/* -DestinationPath rtmp-player-windows-amd64.zip

      - name: Upload player artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtmp-player-windows-amd64
          path: rtmp-player-windows-amd64.zip

      - name: Upload player to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: rtmp-player-windows-amd64.zip
          generate_release_notes: false